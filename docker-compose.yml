version: '3.8'

services:
  # MongoDB Database Instance
  mongodb:
    image: mongo:latest
    container_name: mogul_mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: mogul_db
    volumes:
      - mongo_data:/data/db

  # NestJS Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mogul_api
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/mogul_db
    depends_on:
      - mongodb

  # Next.js Frontend Dashboard
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mogul_web
    ports:
      - '3001:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  mongo_data:
